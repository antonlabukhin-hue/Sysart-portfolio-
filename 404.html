<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="robots" content="noindex">
    <title>Страница не найдена — Система Арт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700&display=swap">
    <!-- 404 отдаётся GitHub Pages с любого адреса, поэтому пути к файлам — от корня сайта -->
    <base href="/">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <style>
        :root { --ink: #0a0a0a; --paper: #fff; --muted: #8c8b86; --line: rgba(255,255,255,.18); --lime: #ef3b36; }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body { min-height: 100dvh; display: flex; flex-direction: column; background: radial-gradient(ellipse 50% 80% at 84% 48%, rgba(239,59,54,.15), transparent 67%), var(--ink); color: var(--paper); font-family: 'Manrope', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        header { height: 84px; display: flex; align-items: center; padding: 0 clamp(22px, 4vw, 64px); border-bottom: 1px solid var(--line); }
        header img { height: 40px; display: block; }
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 60px clamp(22px, 8vw, 132px); }
        .kicker { font-family: 'DM Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--lime); display: flex; align-items: center; gap: 13px; margin-bottom: 22px; }
        .kicker:before { content: ''; width: 45px; height: 1px; background: var(--lime); }
        h1 { margin: 0 0 22px; font-size: clamp(44px, 8vw, 120px); line-height: .9; letter-spacing: -.05em; font-weight: 700; }
        h1 em { color: var(--lime); font-style: normal; font-weight: 400; }
        p { margin: 0 0 36px; max-width: 520px; color: #bdb9b1; font-size: 17px; line-height: 1.55; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; }
        a.btn { display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 26px; border-radius: 999px; font-family: 'DM Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; text-decoration: none; transition: background .25s, color .25s, border-color .25s; }
        .main { background: var(--lime); color: #fff; }
        .main:hover { background: #fff; color: var(--ink); }
        .line { border: 1px solid var(--line); color: var(--paper); }
        .line:hover { border-color: var(--lime); color: var(--lime); }
        footer { padding: 20px clamp(22px, 4vw, 64px); border-top: 1px solid var(--line); font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    </style>
</head>
<body>
    <header><a href="./" aria-label="На главную"><img src="images/logo.png" alt="Система Арт"></a></header>
    <main>
        <div class="kicker">Ошибка 404</div>
        <h1>Здесь <em>темно.</em></h1>
        <p>Такой страницы нет — возможно, ссылка устарела или в ней опечатка. Зато на главной светло: более 70 объектов архитектурной подсветки.</p>
        <div class="actions">
            <a class="btn main" href="./">На главную ↗</a>
            <a class="btn line" href="tel:+79149704000">+7 914 970 40 00</a>
        </div>
    </main>
    <footer>© 2026 Система Арт · info@sysart.ru</footer>
</body>
</html>
