<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система Арт - Портфолио архитектурного освещения</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #ffffff;
            --accent: #ff3333;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
        }

        /* Шапка */
        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            position: absolute; /* Делаем шапку поверх главного фото */
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .logo {
            max-width: 250px;
            height: auto;
        }

        nav {
            margin-top: 20px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* 1. Главный экран (Hero Section) */
        .hero {
            height: 75vh;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            /* В строке ниже можно поменять фоновое фото. Сейчас стоит MONO1.jpg */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(10, 10, 10, 1)), url('images/MONO1.jpg') center/cover no-repeat;
            padding: 20px;
        }

        .hero-content {
            margin-top: 100px;
            animation: fadeIn 2s ease;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 1.2rem;
            color: #ccc;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Сетка проектов */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 300;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ddd;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 100px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer; /* Курсор при наведении */
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.05);
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease, filter 0.5s ease;
            filter: brightness(0.8);
        }

        .card:hover img {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* 2. Полноэкранная галерея (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-radius: 4px;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-close, .lightbox-prev, .lightbox-next {
            position: absolute;
            color: white;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s;
        }

        .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover {
            color: var(--accent);
        }

        .lightbox-close {
            top: 20px;
            right: 40px;
            font-size: 50px;
        }

        .lightbox-prev {
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
        }

        .lightbox-next {
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Подвал */
        footer {
            text-align: center;
            padding: 60px 20px;
            background-color: #050505;
            border-top: 1px solid #111;
        }

        footer .logo {
            max-width: 150px;
            opacity: 0.3;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
            .grid { grid-template-columns: 1fr; }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
        }
    </style>
</head>
