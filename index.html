<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система Арт - Портфолио архитектурного освещения</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --text-main: #ffffff;
            --accent: #ff2a2a; /* Фирменный красный */
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
        }

        /* --- ШАПКА (Теперь здесь только логотип) --- */
        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, transparent 100%);
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .logo {
            max-width: 250px;
            height: auto;
        }

        /* --- ГЛАВНЫЙ ЭКРАН --- */
        .hero {
            height: 85vh; /* Чуть увеличили высоту, чтобы было больше воздуха */
            min-height: 600px;
            display: flex;
            align-items: flex-end; /* ПРИЖИМАЕМ КОНТЕНТ К НИЗУ */
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(5, 5, 5, 1)), url('images/MONO1.jpg') center/cover no-repeat;
            padding: 20px;
            padding-bottom: 60px; /* Отступ от самого низа экрана */
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; /* Расстояние между кнопками и главным заголовком */
            width: 100%;
            animation: fadeIn 1.5s ease;
        }

        /* Контейнер кнопок (теперь внутри главного экрана) */
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
        }

        /* Стиль кнопок */
        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 14px 35px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .nav-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.4);
            transform: translateY(-2px);
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 0;
            text-transform: uppercase;
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        /* --- СЕТКА ПРОЕКТОВ --- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 50px;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .section-title::before, .section-title::after {
            content: "";
            height: 1px;
            width: 50px;
            background-color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 100px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease, filter 0.5s ease;
            filter: brightness(0.85);
        }

        .card::after {
            content: "УВЕЛИЧИТЬ";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            letter-spacing: 2px;
            background: rgba(255, 42, 42, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .card:hover img {
            transform: scale(1.03);
            filter: brightness(0.4);
        }

        .card:hover::after {
            opacity: 1;
        }

        /* --- ПОЛНОЭКРАННАЯ ГАЛЕРЕЯ --- */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 85vh;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            user-select: none;
        }

        .lightbox-btn {
            position: absolute;
            color: white;
            font-size: 35px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            z-index: 10000;
        }

        .lightbox-btn:hover {
            background: var(--accent);
        }

        .lightbox-close { top: 20px; right: 20px; }
        .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
        .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            text-align: center;
            padding: 50px 20px;
            background-color: #020202;
        }

        footer .logo { margin-bottom: 15px; opacity: 0.5; max-width: 120px; }

        /* --- АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНОВ --- */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            
            nav {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
            
            .nav-btn {
                width: 90%;
                max-width: 350px;
                text-align: center;
                padding: 16px 20px;
                font-size: 14px;
                background: rgba(255, 255, 255, 0.08);
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .card img { height: 250px; }
            .section-title { font-size: 1.4rem; }
            .lightbox-prev, .lightbox-next { display: none; }
            .lightbox-close { width: 45px; height: 45px; font-size: 25px; }
        }
    </style>
</head>
<body>

    <!-- Галерея -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-btn lightbox-close" id="closeBtn">&times;</div>
        <div class="lightbox-btn lightbox-prev" id="prevBtn">&#10094;</div>
        <div class="lightbox-btn lightbox-next" id="nextBtn">&#10095;</div>
        <img id="lightbox-img" src="" alt="Фото">
    </div>

    <script>
        const allImages = Array.from(document.querySelectorAll('.card img'));
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        let currentIndex = 0;

        allImages.forEach((img, index) => {
            img.addEventListener('click', () => {
                currentIndex = index;
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            });
        });

        document.getElementById('closeBtn').addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) lightbox.classList.remove('active');
        });

        function showNext() {
            currentIndex = (currentIndex < allImages.length - 1) ? currentIndex + 1 : 0;
            lightboxImg.src = allImages[currentIndex].src;
        }
        function showPrev() {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : allImages.length - 1;
            lightboxImg.src = allImages[currentIndex].src;
        }

        document.getElementById('nextBtn').addEventListener('click', showNext);
        document.getElementById('prevBtn').addEventListener('click', showPrev);

        document.addEventListener('keydown', (e) => {
            if (lightbox.classList.contains('active')) {
                if (e.key === 'ArrowRight') showNext();
                if (e.key === 'ArrowLeft') showPrev();
                if (e.key === 'Escape') lightbox.classList.remove('active');
            }
        });

        let touchstartX = 0;
        let touchendX = 0;
        
        lightbox.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, false);
        
        lightbox.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);
        
        function handleSwipe() {
            if (touchendX < touchstartX - 50) showNext();
            if (touchendX > touchstartX + 50) showPrev();
        }
    </script>
